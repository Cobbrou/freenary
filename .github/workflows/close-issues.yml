name: Close issues

# GitHub closes the issues a pull request names ("Closes #n") only when it
# merges into the default branch, main. Pull requests merge into dev, so this
# closes them at that merge instead. pull_request_target gives a fork's pull
# request a token that can write issues; the job never checks out the head.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close the issues the description names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$BODY" \
            | grep -ioE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
            | grep -oE '[0-9]+$' \
            | sort -u \
            | while read -r issue; do
                gh issue close "$issue" --reason completed --comment "Closed by #$PR, merged into dev." || true
              done
