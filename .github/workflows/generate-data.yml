name: Generate merchant data

on:
  schedule:
    # Monday 03:00 UTC — fresh data for the work week
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "packages/api/scripts/**"
      - "packages/api/src/categorisation/normalise/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate independent data (parallel)
        working-directory: packages/api
        run: |
          bun scripts/generate-place-tokens.ts &
          bun scripts/fetch-wikidata-brands.ts &
          wait

      - name: Build merchant dictionary
        run: bun scripts/build-merchant-dictionary.ts
        working-directory: packages/api

      - name: Create release tarball
        run: |
          cd packages/api
          tar -czf /tmp/merchant-data.tar.gz \
            data/place-tokens.json \
            data/merchants.jsonl.gz \
            $([ -f data/wikidata-brands.json ] && echo data/wikidata-brands.json || true)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" /tmp/merchant-data.tar.gz \
            --title "Merchant data $(date -u +%Y-%m-%d)" \
            --notes "Auto-generated merchant dictionary (NSI + Wikidata + curated)." \
            --latest=false
