name: Feature request
description: Suggest an improvement for Freenary
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new features or workflow improvements.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today? Include a short summary here too.
      placeholder: It is hard to understand my full financial position across accounts.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you want to see
      placeholder: Add a consolidated net-worth view on the Home dashboard.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Workarounds, related tools, mockups, or anything else that helps
    validations:
      required: false
