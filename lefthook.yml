# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  piped: true
  jobs:
    - name: oxlint
      # oxlint exits 1 when the staged set holds no file it can lint. The glob
      # covers a documentation-only commit; the flag covers a commit whose only
      # source files sit under an ignored path, such as packages/ui.
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: bun oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      run: bun oxfmt --write {staged_files}
      stage_fixed: true
    - name: env-sync
      # The schema is the only authored source: .env.example and
      # docs/reference/configuration.md are generated from it. stage_fixed
      # restages only the matched files, so the outputs are added explicitly.
      glob: "{packages/env/src/schema*.ts,docker-compose*.yml,deploy/docker-compose.yml,scripts/env-sync.ts,scripts/docs-markdown.ts}"
      run: bun run env:sync && git add .env.example docs/reference/configuration.md
    - name: docs-reference
      # The API, commands and compose-file reference pages and the OpenAPI
      # document are generated from the router, the server entry, the root
      # package.json and the compose files.
      glob: "{package.json,docker-compose*.yml,deploy/docker-compose.yml,apps/server/src/index.ts,packages/api/src/**/*.ts,scripts/docs-reference.ts,scripts/docs-markdown.ts}"
      run: bun run docs:generate && git add docs/reference/openapi.json docs/reference/api.md docs/reference/commands.md docs/reference/compose-files.md
