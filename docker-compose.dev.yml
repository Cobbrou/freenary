name: freenary

# The development stack: PostgreSQL, the database migrations, the API server,
# the web app and the documentation site, built from the working tree. Compose
# watch syncs every edit under apps/, packages/ and docs/ into the containers.
# `bun run dev:up` starts it under a project named after the worktree. No
# service publishes a host port: Kiri routes each hostname from its labels.

x-app-build: &app-build
  context: .
  dockerfile: .docker/dockerfile.dev

x-app-watch: &app-watch
  - action: sync
    path: ./apps
    target: /app/apps
    ignore:
      - node_modules/
      # Generated on each side by the paraglide compile step: syncing the host
      # copy over the container's deletes it mid-session, and Vite caches the
      # failed resolution of `@/paraglide/server.js` into a permanent 500.
      - web/src/paraglide/
  - action: sync
    path: ./packages
    target: /app/packages
    ignore:
      - node_modules/
  - action: sync
    path: ./docs
    target: /app/docs
  - action: rebuild
    path: ./bun.lock

# The root .env file is optional, and every variable a contributor sets in it
# reaches the containers through it. Only the values this stack derives from the
# worktree are listed below, and `environment` wins over `env_file`.
x-app-env-file: &app-env-file
  - path: .env
    required: false

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-freenary}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev_secret_change_me_at_least_32chars}
  # Kiri routes every hostname to its container and ends HTTPS on the host, so
  # the apps keep serving plain HTTP. Web and server share the parent domain in
  # AUTH_COOKIE_DOMAIN, so a Lax cookie reaches both.
  BETTER_AUTH_URL: ${FREENARY_DEV_SCHEME:-https}://${SERVER_HOST:-server.freenary.kiri.localhost}
  CORS_ORIGIN: ${FREENARY_DEV_SCHEME:-https}://${WEB_HOST:-web.freenary.kiri.localhost}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  NODE_ENV: development

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freenary}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    expose:
      - "${POSTGRES_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-freenary}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending migrations before the server starts.
  # Re-runs on every `up` (idempotent); exits 0 when the schema is current.
  bootstrap:
    build: *app-build
    working_dir: /app/packages/db
    command: bun x prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-freenary}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: *app-build
    working_dir: /app/apps/server
    command: bun run --hot src/index.ts
    env_file: *app-env-file
    environment:
      <<: *app-env
    # Kiri's router reads these labels: the hostname it answers to, and the
    # container port it forwards that hostname to.
    labels:
      dev.kiri.domain: ${SERVER_HOST:-server.freenary.kiri.localhost}
      dev.kiri.http.port: "3000"
    develop:
      watch: *app-watch
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: *app-build
    working_dir: /app/apps/web
    command: bun run dev -- --host 0.0.0.0
    environment:
      VITE_SERVER_URL: ${FREENARY_DEV_SCHEME:-https}://${SERVER_HOST:-server.freenary.kiri.localhost}
      # What the web app's own server calls while rendering a page: the
      # container network, since `*.localhost` resolves to the container itself.
      SERVER_URL: ${SERVER_URL:-http://server:3000}
      DEV_PUBLIC_URL: ${FREENARY_DEV_SCHEME:-https}://${WEB_HOST:-web.freenary.kiri.localhost}
    labels:
      dev.kiri.domain: ${WEB_HOST:-web.freenary.kiri.localhost}
      dev.kiri.http.port: "3001"
    develop:
      watch: *app-watch
    depends_on:
      - server
    restart: unless-stopped

  docs:
    build: *app-build
    working_dir: /app/apps/fumadocs
    command: bun run dev -- --host 0.0.0.0
    environment:
      DOCS_PORT: ${DOCS_PORT:-4000}
      DEV_PUBLIC_URL: ${FREENARY_DEV_SCHEME:-https}://${DOCS_HOST:-docs.freenary.kiri.localhost}
    labels:
      dev.kiri.domain: ${DOCS_HOST:-docs.freenary.kiri.localhost}
      dev.kiri.http.port: "4000"
    develop:
      watch: *app-watch
    restart: unless-stopped

volumes:
  pgdata:
